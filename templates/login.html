<!DOCTYPE html>
<html>

<head>

<title>Login | EventHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
rel="stylesheet">


<style>
body{
    min-height:100vh;
    background:#fff4e8;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;   /* Adds top & bottom space */
}
.login-card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0px 5px 25px gray;
}
.logo{
text-align:center;
font-size:50px;
}
h2{
text-align:center;
font-weight:bold;
color:#07183d;
margin-bottom:30px;
}
label{
font-weight:bold;
color:#07183d;
}
.form-control,
.form-select{
padding:12px;
border-radius:12px;
}
.login-btn{
background:#58745e;
color:white;
width:100%;
padding:12px;
border-radius:30px;
font-size:18px;
}
.login-btn:hover{
background:#07183d;
color:white;
}
a{
color:#58745e;
font-weight:bold;
text-decoration:none;
}
</style>
</head>
<body>
<div class="login-card">
<div class="logo">
🎟️
</div>
<h2>
EventHub Login
</h2>

<form method="POST">

    {% csrf_token %}

    {% if messages %}
    {% for message in messages %}

        <div class="alert alert-{{ message.tags }}">

            {{ message }}

        </div>

    {% endfor %}
{% endif %}

    <label>Username</label>

    <input
        type="text"
        name="username"
        class="form-control mb-3"
        placeholder="Enter Username"
        required>

    <label>Password</label>

    <input
        type="password"
        name="password"
        class="form-control mb-4"
        placeholder="Enter Password"
        required>

    <button
        type="submit"
        class="btn login-btn w-100">

        <i class="bi bi-box-arrow-in-right"></i>

        Login

    </button>

    <p class="text-center mt-4">

        Don't have an account?

        <a href="{% url 'register' %}">

            Register

        </a>

    </p>

</form>

</div>
</body>
</html>
