{% extends "base-student.html" %}

{% block content %}

<h2 class="fw-bold mb-4">

👋 Welcome {{ request.user.username }}

</h2>

<div class="row">

<div class="col-md-3 mb-4">

<div class="card shadow text-center">

<div class="card-body">

<h5>Registrations</h5>

<h2>{{ total_registrations }}</h2>

</div>

</div>

</div>

<div class="col-md-3 mb-4">

<div class="card shadow text-center">

<div class="card-body">

<h5>Upcoming</h5>

<h2>{{ upcoming_count }}</h2>

</div>

</div>

</div>

<div class="col-md-3 mb-4">

<div class="card shadow text-center">

<div class="card-body">

<h5>Completed</h5>

<h2>{{ completed_events }}</h2>

</div>

</div>

</div>

<div class="col-md-3 mb-4">

<div class="card shadow text-center">

<div class="card-body">

<h5>Wishlist</h5>

<h2>{{ wishlist_count }}</h2>

</div>

</div>

</div>

</div>

{% endblock %}
