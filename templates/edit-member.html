<!DOCTYPE html>
<html>
<head>

<title>Edit Organizer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#fff4e8;">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Organizer</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<label>Name</label>

<input
type="text"
name="name"
value="{{ member.name }}"
class="form-control mb-3">

<label>Email</label>

<input
type="email"
name="email"
value="{{ member.email }}"
class="form-control mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
value="{{ member.phone }}"
class="form-control mb-3">

<label>Department</label>

<input
type="text"
name="department"
value="{{ member.department }}"
class="form-control mb-3">

<label>Designation</label>

<input
type="text"
name="designation"
value="{{ member.designation }}"
class="form-control mb-4">

<button class="btn btn-success">

Update

</button>

</form>

</div>

</div>

</div>

</body>

</html>
