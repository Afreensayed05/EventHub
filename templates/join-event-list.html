<!DOCTYPE html>
<html>
<head>

<title>Joined Students</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#fff4e8;">

<div class="container mt-5">

<h2 class="mb-4">

Joined Students

</h2>

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Event</th>

<th>Ticket</th>

</tr>

</thead>

<tbody>

{% for r in registrations %}

<tr>

<td>{{ r.id }}</td>

<td>{{ r.name }}</td>

<td>{{ r.email }}</td>

<td>{{ r.phone }}</td>

<td>{{ r.event.title }}</td>

<td>

<a href="{% url 'ticket' r.id %}" class="btn btn-success btn-sm">

View Ticket

</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="6">

No Registrations Yet

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
