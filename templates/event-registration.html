<!DOCTYPE html>
<html>
<head>

<title>Event Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
rel="stylesheet">

<style>
body{
background:#fff4e8;
}
.header{
background:#07183d;
color:white;
padding:25px;
text-align:center;
border-radius:0 0 30px 30px;
}
.form-card{
background:white;
margin-top:40px;
padding:35px;
border-radius:20px;
box-shadow:0px 5px 25px gray;
}
.form-card h2{
text-align:center;
color:#07183d;
font-weight:bold;
margin-bottom:30px;
}
label{
font-weight:bold;
color:#07183d;
}
.form-control,
.form-select{
padding:12px;
border-radius:10px;
}
.input-group-text{
background:#58745e;
color:white;
}
.btn-register{
background:#58745e;
color:white;
padding:12px 50px;
border-radius:30px;
font-size:18px;
}
.btn-register:hover{
background:#49664f;
color:white;
}
.event-box{
background:#07183d;
color:white;
padding:15px;
border-radius:15px;
text-align:center;
margin-bottom:25px;
}
</style>
</head>

<body>
<div class="header">
<h1>
<i class="bi bi-calendar-check"></i>
Event Registration
</h1>
</div>
<div class="container">
<div class="row justify-content-center">
<div class="col-md-8">
<div class="form-card">
<div class="event-box">
<h3>{{ event.title }}</h3>

<p>
{{ event.category }} | {{ event.venue }}
</p>
</div>
<h2>
Participant Details
</h2>
<form method="POST">

    {% csrf_token %}
<label>
Participant Name
</label>
<div class="input-group mb-3">
<span class="input-group-text">
<i class="bi bi-person"></i>
</span>
<input
type="text"
name="name"
class="form-control"
placeholder="Enter your name"
required>
</div>
<label>
    Email
</label>
<div class="input-group mb-3">
<span class="input-group-text">
<i class="bi bi-envelope"></i>
</span>
<input
type="email"
name="email"
class="form-control"
placeholder="Enter email"
required>
</div>
<label>
Phone Number
</label>
<div class="input-group mb-3">
<span class="input-group-text">
<i class="bi bi-phone"></i>
</span>
<input
type="text"
name="phone"
class="form-control"
placeholder="Enter mobile number"
required>
</div>
<label>College</label>

<div class="input-group mb-3">

<span class="input-group-text">
<i class="bi bi-building"></i>
</span>

<input
type="text"
name="college"
class="form-control"
placeholder="Enter College Name"
required>

</div>
<label>
Department
</label>
<select name="department" class="form-select mb-3">
<option>Select Department</option>
<option>CSE</option>
<option>IT</option>
<option>ECE</option>
<option>EEE</option>
<option>Mechanical</option>
</select>
<label>
Year</label>
<select name="year" class="form-select mb-3">
<option>Select Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
<div class="text-center">

<button
type="submit"
class="btn btn-register">

<i class="bi bi-check-circle"></i>

Register Now

</button>

</div>
</form>
</div>
</div>
</div>
</div>
</body>

</html>
