<!DOCTYPE html>
<html>

<head>

<title>Feedback Form</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
rel="stylesheet">
<style>
body{
background:#fff4e8;
}
.feedback-card{
width:650px;
margin:50px auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0px 5px 25px gray;
}
.heading{
background:#07183d;
color:white;
text-align:center;
padding:20px;
border-radius:15px;
margin-bottom:30px;
}
label{
font-weight:bold;
color:#07183d;
margin-top:15px;
}
.form-control{
padding:12px;
border-radius:10px;
}
.event-name{
background:#58745e;
color:white;
padding:15px;
text-align:center;
border-radius:15px;
margin-bottom:25px;
}
.rating{
font-size:35px;
text-align:center;
margin:20px;
}
.rating i{
color:#f4c430;
cursor:pointer;
margin:5px;
}
.submit-btn{
background:#07183d;
color:white;
padding:12px 40px;
border-radius:30px;
}
.submit-btn:hover{
background:#58745e;
color:white;
}
</style>
</head>

<body>
<div class="feedback-card">
<div class="heading">
<h2>
<i class="bi bi-chat-square-heart"></i>
Feedback Form
</h2>
</div>
<div class="event-name">
<h4>
Code Challenge 2026
</h4>
<p>
Mentor : Vamsi
</p>
</div>
<form method="POST">

{% csrf_token %}
<label>
Participant Name
</label>
<input
type="text"
name="student_name"
class="form-control"
placeholder="Enter your name"
required>
<label>
Ticket ID
</label>
<input
type="text"
name="ticket_id"
class="form-control"
placeholder="Example : EVT2026001">
<label>Rating</label>

<select
name="rating"
class="form-control mb-3"
required>

<option value="">Select Rating</option>

<option value="5">⭐⭐⭐⭐⭐ Excellent</option>

<option value="4">⭐⭐⭐⭐ Very Good</option>

<option value="3">⭐⭐⭐ Good</option>

<option value="2">⭐⭐ Fair</option>

<option value="1">⭐ Poor</option>

</select>

<textarea
name="comments"
class="form-control"
rows="5"
placeholder="Share your experience about this event..."
required></textarea>
<div class="text-center mt-4">
<button type="submit" class="btn submit-btn">
<i class="bi bi-send"></i>
Submit Feedback
</button>
</div>
</form>
</div>
</body>

</html>
