<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Event</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#fff4e8;
}

.card{
    border:none;
    border-radius:18px;
}

.card-header{
    background:#07183d;
    color:white;
    border-radius:18px 18px 0 0 !important;
}

.btn-success{
    background:#58745e;
    border:none;
}

.btn-success:hover{
    background:#49664f;
}

img{
    border-radius:12px;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header">

<h3 class="mb-0">

<i class="bi bi-pencil-square"></i>

Edit Event

</h3>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Event Title

</label>

<input
type="text"
name="title"
class="form-control"
value="{{ event.title }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Category

</label>

<select
name="category"
class="form-select">

{% for category in categories %}

<option
value="{{ category.id }}"
{% if category.id == event.category.id %}selected{% endif %}>

{{ category.name }}

</option>

{% endfor %}

</select>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Date

</label>

<input
type="date"
name="date"
class="form-control"
value="{{ event.date|date:'Y-m-d' }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Time

</label>

<input
type="time"
name="time"
class="form-control"
value="{{ event.time|time:'H:i' }}">

</div>

</div>

<div class="mb-3">

<label class="form-label">

Venue

</label>

<input
type="text"
name="venue"
class="form-control"
value="{{ event.venue }}">

</div>

<div class="mb-3">

<label class="form-label">

Price

</label>

<input
type="number"
step="0.01"
name="price"
class="form-control"
value="{{ event.price }}">

</div>

<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea
name="description"
rows="5"
class="form-control">{{ event.description }}</textarea>

</div>

<div class="mb-3">

<label class="form-label">

Status

</label>

<select
name="status"
class="form-select">

<option value="Active"
{% if event.status == "Active" %}selected{% endif %}>
Active
</option>

<option value="Completed"
{% if event.status == "Completed" %}selected{% endif %}>
Completed
</option>

<option value="Cancelled"
{% if event.status == "Cancelled" %}selected{% endif %}>
Cancelled
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Event Poster
</label>
<input
type="file"
name="image"
class="form-control">
</div>
{% if event.image %}
<div class="text-center mb-4">
<img
src="{{ event.image.url }}"
width="350"
class="img-fluid shadow">
</div>
{% endif %}
<div class="d-flex justify-content-between">
<a
href="{% url 'my_events' %}"
class="btn btn-secondary">
<i class="bi bi-arrow-left"></i>
Back
</a>
<button
type="submit"
class="btn btn-success">
<i class="bi bi-check-circle"></i>
Update Event
</button>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
