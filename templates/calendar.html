{% extends "base-admin.html" %}

{% block content %}

<h2 class="mb-4">

<i class="bi bi-calendar3"></i>

Calendar View

</h2>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
rel="stylesheet">

<div class="card shadow">

<div class="card-body">

<div id="calendar"></div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    var calendarEl = document.getElementById("calendar");

    const calendarEvents = JSON.parse('{{ calendar_events|escapejs }}');

    var calendar = new FullCalendar.Calendar(calendarEl, {

        initialView: "dayGridMonth",

        height: 650,

        events: calendarEvents,

        eventClick: function(info){

            alert(
                "📅 " + info.event.title +
                "\n\n📍 Venue : " + info.event.extendedProps.venue +
                "\n\n📝 " + info.event.extendedProps.description
            );

        }

    });

    calendar.render();

});
</script>



{% endblock %}
