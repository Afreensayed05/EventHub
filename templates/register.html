<!DOCTYPE html>
<html>

<head>

<title>Register | EventHub</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
rel="stylesheet">

<style>
body{
min-height:100vh;
background:#fff4e8;
display:flex;
align-items:center;
justify-content:center;
padding:30px;
}
.register-card{
width:420px;
background:white;
padding:40px;
border-radius:25px;
box-shadow:0px 5px 25px gray;
}
.logo{
font-size:50px;
text-align:center;
}
h2{
text-align:center;
font-weight:bold;
color:#07183d;
margin-bottom:30px;
}
label{
font-weight:bold;
color:#07183d;
}
.form-control,
.form-select{
padding:12px;
border-radius:12px;
}
.register-btn{
background:#07183d;
color:white;
width:100%;
padding:12px;
border-radius:30px;
font-size:18px;
}
.register-btn:hover{
background:#58745e;
color:white;
}
a{
color:#58745e;
font-weight:bold;
text-decoration:none;
}
</style>
</head>

<body>
<div class="register-card">
<div class="logo">
🎟️
</div>
<h2>
Create Account
</h2>

{% if messages %}

{% for message in messages %}

<div class="alert alert-info">

{{ message }}

</div>

{% endfor %}

{% endif %}


<form method="POST">

    {% csrf_token %}

    <label>Username</label>
    <input
        type="text"
        name="username"
        class="form-control mb-3"
        placeholder="Enter Username"
        required>

    <label>Email</label>
    <input
        type="email"
        name="email"
        class="form-control mb-3"
        placeholder="Enter Email"
        required>

    <label>Password</label>
    <input
        type="password"
        name="password"
        class="form-control mb-3"
        placeholder="Create Password"
        required>

    <label>Confirm Password</label>
    <input
        type="password"
        name="confirm_password"
        class="form-control mb-3"
        placeholder="Confirm Password"
        required>

        <label>Register As</label>

<select
    name="role"
    class="form-select mb-3"
    required>

    <option value="Participant">
        Participant
    </option>

    <option value="Organizer">
        Organizer
    </option>

</select>

    <button
        type="submit"
        class="btn register-btn w-100">

        <i class="bi bi-person-plus"></i>
        Register

    </button>

    <p class="text-center mt-4">
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</form>

</div>
</body>
</html>
